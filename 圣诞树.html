<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣诞树 - Holiday Magic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --cream: #fceea7;
            --bg: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Times New Roman', serif;
            color: var(--cream);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Components */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease-out;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid transparent;
            border-top: 1px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader p {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            font-size: 14px;
            color: var(--gold);
        }

        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #ui-layer.ui-hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            margin-top: 40px;
            background: linear-gradient(to bottom, #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            pointer-events: auto;
        }

        .upload-wrapper {
            position: absolute;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }

        .btn-upload {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-upload:hover {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 15px var(--gold);
        }

        .hint {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        /* MediaPipe Hidden Elements */
        #webcam-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        video, canvas#mp-canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>LOADING HOLIDAY MAGIC</p>
    </div>

    <div id="ui-layer">
        <h1>Merry Christmas</h1>
        
        <div class="upload-wrapper">
            <label for="photo-upload" class="btn-upload">Add Memories</label>
            <input type="file" id="photo-upload" accept="image/*">
            <div class="hint">Press 'H' to Hide Controls</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="webcam-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="mp-canvas"></canvas>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- Constants & State ---
        const MODES = { TREE: 'TREE', SCATTER: 'SCATTER', FOCUS: 'FOCUS' };
        const STATE = {
            mode: MODES.TREE,
            handData: null,
            targetRotation: new THREE.Euler(),
            focusObject: null,
            lastModeChange: 0
        };

        // --- Particle Class ---
        class Particle {
            constructor(mesh, type = 'DECOR') {
                this.mesh = mesh;
                this.type = type;
                this.basePos = new THREE.Vector3();
                this.targetPos = new THREE.Vector3();
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1
                );
                this.randomRotation = new THREE.Vector3(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.scale = 1;
                this.targetScale = 1;
            }

            update(mode, focusObject) {
                // Lerp position
                this.mesh.position.lerp(this.targetPos, 0.05);

                // Mode-specific behavior
                if (mode === MODES.SCATTER) {
                    this.mesh.rotation.x += this.velocity.x;
                    this.mesh.rotation.y += this.velocity.y;
                    this.mesh.rotation.z += this.velocity.z;
                } else if (mode === MODES.TREE) {
                    // Subtle floating
                    this.mesh.position.y += Math.sin(Date.now() * 0.001 + this.mesh.id) * 0.005;
                } else if (mode === MODES.FOCUS) {
                    if (this === focusObject) {
                        this.mesh.position.lerp(new THREE.Vector3(0, 2, 35), 0.1);
                        this.targetScale = 4.5;
                    } else {
                        // Push others away
                        const dir = this.mesh.position.clone().normalize().multiplyScalar(40);
                        this.targetPos.copy(dir);
                        this.targetScale = 0.5;
                    }
                }

                if (mode !== MODES.FOCUS) {
                    this.targetScale = this.scale;
                }

                const s = THREE.MathUtils.lerp(this.mesh.scale.x, this.targetScale, 0.1);
                this.mesh.scale.set(s, s, s);
            }
        }

        // --- Main Application Class ---
        class App {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.particles = [];
                this.photos = [];
                this.init();
            }

            init() {
                this.setupScene();
                this.setupLights();
                this.setupPostProcessing();
                this.createContent();
                this.addEventListeners();
                this.animate();
                
                // Fade out loader
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    if (loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.remove(), 1000);
                    }
                }, 1500);

                // Load MediaPipe in the background
                this.setupMediaPipe();
            }

            setupScene() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 2, 50);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 2.2;
                this.container.appendChild(this.renderer.domElement);

                // Environment
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                this.scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.autoRotate = true;
                this.controls.autoRotateSpeed = 0.5;

                this.mainGroup = new THREE.Group();
                this.scene.add(this.mainGroup);
            }

            setupLights() {
                const ambient = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambient);

                const point = new THREE.PointLight(0xffa500, 2);
                point.position.set(0, 5, 0);
                this.scene.add(point);

                const spot1 = new THREE.SpotLight(0xd4af37, 1200);
                spot1.position.set(30, 40, 40);
                spot1.angle = 0.3;
                this.scene.add(spot1);

                const spot2 = new THREE.SpotLight(0x0000ff, 600);
                spot2.position.set(-30, 20, -30);
                spot2.angle = 0.5;
                this.scene.add(spot2);
            }

            setupPostProcessing() {
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));

                this.bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.45, // strength
                    0.4,  // radius
                    0.7   // threshold
                );
                this.composer.addPass(this.bloomPass);
            }

            async setupMediaPipe() {
                try {
                    const vision = await FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                    );
                    this.handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 1
                    });

                    const video = document.getElementById('webcam');
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (e) {
                    console.warn("MediaPipe failed to load. Gesture controls disabled.", e);
                }
            }

            createContent() {
                // Materials
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 });
                const greenMat = new THREE.MeshStandardMaterial({ color: 0x003300, metalness: 0.5, roughness: 0.5 });
                const redMat = new THREE.MeshPhysicalMaterial({ 
                    color: 0xaa0000, 
                    metalness: 0.8, 
                    roughness: 0.2,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.1
                });

                // 1. Main Particles (1500)
                for (let i = 0; i < 1500; i++) {
                    let geo, mat;
                    if (Math.random() > 0.5) {
                        geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                        mat = Math.random() > 0.3 ? greenMat : goldMat;
                    } else {
                        geo = new THREE.SphereGeometry(0.3, 16, 16);
                        mat = Math.random() > 0.4 ? redMat : goldMat;
                    }
                    const mesh = new THREE.Mesh(geo, mat);
                    const p = new Particle(mesh);
                    this.particles.push(p);
                    this.mainGroup.add(mesh);
                }

                // 2. Dust Particles (2500)
                const dustGeo = new THREE.SphereGeometry(0.05, 8, 8);
                const dustMat = new THREE.MeshBasicMaterial({ color: 0xfceea7 });
                for (let i = 0; i < 2500; i++) {
                    const mesh = new THREE.Mesh(dustGeo, dustMat);
                    const p = new Particle(mesh, 'DUST');
                    p.scale = 0.5 + Math.random();
                    this.particles.push(p);
                    this.mainGroup.add(mesh);
                }

                // 3. Candy Canes
                this.createCandyCanes();

                // 4. Default Photo
                this.createDefaultPhoto();

                this.setMode(MODES.TREE);
            }

            createCandyCanes() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 128, 128);
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 20;
                for (let i = -128; i < 256; i += 40) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i + 128, 128);
                    ctx.stroke();
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(2, 10);

                const caneMat = new THREE.MeshStandardMaterial({ map: tex });

                for (let i = 0; i < 15; i++) {
                    const curve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(0, 2, 0),
                        new THREE.Vector3(0.5, 2.5, 0),
                        new THREE.Vector3(1, 2, 0)
                    ]);
                    const geo = new THREE.TubeGeometry(curve, 20, 0.15, 8, false);
                    const mesh = new THREE.Mesh(geo, caneMat);
                    const p = new Particle(mesh, 'CANE');
                    this.particles.push(p);
                    this.mainGroup.add(mesh);
                }
            }

            createDefaultPhoto() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fceea7';
                ctx.fillRect(0, 0, 512, 512);
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 60px Cinzel';
                ctx.textAlign = 'center';
                ctx.fillText('JOYEUX NOEL', 256, 270);
                
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                this.addPhotoToScene(tex);
            }

            addPhotoToScene(texture) {
                const frameGeo = new THREE.BoxGeometry(5.2, 5.2, 0.2);
                const frameMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 });
                const frame = new THREE.Mesh(frameGeo, frameMat);

                const photoGeo = new THREE.PlaneGeometry(5, 5);
                const photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                const photo = new THREE.Mesh(photoGeo, photoMat);
                photo.position.z = 0.11;
                frame.add(photo);

                const p = new Particle(frame, 'PHOTO');
                this.particles.push(p);
                this.photos.push(p);
                this.mainGroup.add(frame);
                
                // If we just added a photo, re-calculate positions
                this.setMode(STATE.mode);
            }

            setMode(mode) {
                STATE.mode = mode;
                STATE.lastModeChange = Date.now();

                if (mode === MODES.FOCUS) {
                    STATE.focusObject = this.photos[Math.floor(Math.random() * this.photos.length)];
                }

                this.particles.forEach((p, i) => {
                    if (mode === MODES.TREE) {
                        const t = i / this.particles.length;
                        const maxRadius = 15;
                        const height = 30;
                        const radius = maxRadius * (1 - t);
                        const angle = t * 50 * Math.PI;
                        p.targetPos.set(
                            Math.cos(angle) * radius,
                            t * height - 10,
                            Math.sin(angle) * radius
                        );
                    } else if (mode === MODES.SCATTER) {
                        const r = 8 + Math.random() * 12;
                        const phi = Math.acos(-1 + (2 * i) / this.particles.length);
                        const theta = Math.sqrt(this.particles.length * Math.PI) * phi;
                        p.targetPos.set(
                            r * Math.cos(theta) * Math.sin(phi),
                            r * Math.sin(theta) * Math.sin(phi),
                            r * Math.cos(phi)
                        );
                    }
                });
            }

            processGestures(results) {
                if (!results.landmarks || results.landmarks.length === 0) return;
                const landmarks = results.landmarks[0];
                
                // Palm center (Landmark 9)
                const palm = landmarks[9];
                STATE.targetRotation.y = (palm.x - 0.5) * Math.PI * 0.5;
                STATE.targetRotation.x = (palm.y - 0.5) * Math.PI * 0.5;

                // Gesture Logic
                const thumb = landmarks[4];
                const index = landmarks[8];
                const wrist = landmarks[0];
                const fingers = [landmarks[8], landmarks[12], landmarks[16], landmarks[20]];

                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y, thumb.z - index.z);
                const avgFingerDist = fingers.reduce((sum, f) => sum + Math.hypot(f.x - wrist.x, f.y - wrist.y), 0) / 4;

                const now = Date.now();
                if (now - STATE.lastModeChange < 1000) return;

                if (pinchDist < 0.05) {
                    if (STATE.mode !== MODES.FOCUS) this.setMode(MODES.FOCUS);
                } else if (avgFingerDist < 0.25) {
                    if (STATE.mode !== MODES.TREE) this.setMode(MODES.TREE);
                } else if (avgFingerDist > 0.4) {
                    if (STATE.mode !== MODES.SCATTER) this.setMode(MODES.SCATTER);
                }
            }

            addEventListeners() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    this.composer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'h') {
                        document.getElementById('ui-layer').classList.toggle('ui-hidden');
                    }
                });

                const upload = document.getElementById('photo-upload');
                upload.addEventListener('change', (e) => {
                    const f = e.target.files[0];
                    if (!f) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        new THREE.TextureLoader().load(ev.target.result, (t) => {
                            t.colorSpace = THREE.SRGBColorSpace;
                            this.addPhotoToScene(t);
                        });
                    }
                    reader.readAsDataURL(f);
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const now = Date.now();

                // MediaPipe Update
                if (this.handLandmarker) {
                    const video = document.getElementById('webcam');
                    if (video.readyState >= 2) {
                        const results = this.handLandmarker.detectForVideo(video, now);
                        this.processGestures(results);
                    }
                }

                // Smooth rotation from hand
                this.mainGroup.rotation.y = THREE.MathUtils.lerp(this.mainGroup.rotation.y, STATE.targetRotation.y, 0.05);
                this.mainGroup.rotation.x = THREE.MathUtils.lerp(this.mainGroup.rotation.x, STATE.targetRotation.x, 0.05);

                this.particles.forEach(p => p.update(STATE.mode, STATE.focusObject));

                this.controls.update();
                this.composer.render();
            }
        }

        // Start App
        new App();
    </script>
</body>
</html>
